<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopDawgs — off the trail</title>
<link rel="icon" href="./icon-192.png" type="image/png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;
    background:radial-gradient(900px 600px at 50% -10%,#12283f,transparent 60%),#09111E;color:#E8F4FB;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 50px -10px rgba(0,229,255,.65);margin-bottom:22px;}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:.02em;}
  h1 span{color:#00E5FF;}
  p{color:#8FAFC7;font-size:14px;margin:0 0 22px;}
  a{display:inline-block;padding:11px 22px;border-radius:10px;font-weight:700;font-size:13px;
    text-decoration:none;color:#03202a;background:linear-gradient(150deg,#00E5FF,#0aa6c4);
    box-shadow:0 0 20px -6px rgba(0,229,255,.9);}
</style>
</head>
<body>
  <div>
    <img src="./icon-192.png" alt="TopDawgs">
    <h1>This dawg wandered <span>off the trail</span></h1>
    <p>That page isn't part of the pack.</p>
    <a href="./">Back to the yard</a>
  </div>
</body>
</html>
