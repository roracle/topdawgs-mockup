<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>TopDawgs — App Prototype</title>
<meta name="theme-color" content="#0b1826">
<meta name="description" content="TopDawgs mobile app — clickable prototype (Community, Pack, Body, Mind).">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.svg">
<link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app"></div>

<!-- Demo-only rank switcher: lets reviewers see Mutt / Pack Dawg / TopDawg gating
     without a real backend. Not part of the shipped app UI. -->
<div class="dev-bar" id="devBar"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
<script>
  // Wire up the demo rank switcher after app.js defines STATE + render().
  function renderDevBar() {
    const ranks = [['mutt','Mutt'],['pack','Pack Dawg'],['top','TopDawg']];
    document.getElementById('devBar').innerHTML = ranks.map(([k,l]) =>
      `<button class="${STATE.user.rank===k?'active':''}" data-rank="${k}">${l}</button>`
    ).join('') + `<button data-rank="__login">${STATE.loggedIn ? 'Restart onboarding' : 'Skip to app'}</button>`;
  }
  document.getElementById('devBar').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const rank = btn.getAttribute('data-rank');
    if (rank === '__login') {
      if (STATE.loggedIn) { STATE.loggedIn = false; STATE.idUploaded = false; location.hash = '#/welcome'; }
      else { STATE.loggedIn = true; location.hash = '#/community'; }
    } else {
      STATE.user.rank = rank;
      if (rank === 'mutt') STATE.user.nsfwEnabled = false;
    }
    render();
    renderDevBar();
  });
  const _r = render;
  render = function() { _r(); renderDevBar(); };
  renderDevBar();
</script>
</body>
</html>
