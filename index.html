<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>TopDawgs</title>
<meta name="description" content="TopDawgs — find your pack.">

<meta name="theme-color" content="#09111E">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TopDawgs">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-root">

  <!-- Shown only if scripts fail, so a crash is never a blank screen. -->
  <div id="boot-error" class="boot-error hidden">
    <h2>TopDawgs couldn't start</h2>
    <p id="boot-error-msg">Something went wrong loading the app.</p>
    <button class="btn btn-primary" onclick="location.reload()">Reload</button>
  </div>

  <noscript>
    <div class="boot-error"><h2>JavaScript is off</h2><p>TopDawgs needs JavaScript to run. Turn it on and reload.</p></div>
  </noscript>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-logo"><img src="assets/logo.webp" alt="" width="104" height="104"></div>
    <h1 class="login-title">TopDawgs</h1>
    <p class="login-tag">Find your pack.</p>

    <div class="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" value="AlphaDawg" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Any password works" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin(false)">Log in</button>
      <button class="btn btn-ghost btn-block" onclick="doLogin(true)">Explore as an unverified Mutt</button>
    </div>

    <p class="login-hint">Prototype — no real account needed. The Mutt option shows the restricted view: NSFW locked off, explicit media blocked, Tier&nbsp;2 flirts unavailable.</p>
    <p class="login-install" id="install-hint"></p>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-shell" class="app-shell hidden">
    <header id="app-header" class="app-header"></header>
    <main id="app-main" class="app-main"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Sections"></nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
  // Catch any load-time failure and surface it instead of a blank page.
  window.addEventListener('error', function (e) {
    var box = document.getElementById('boot-error');
    var shell = document.getElementById('app-shell');
    if (!box || (shell && !shell.classList.contains('hidden'))) return;
    document.getElementById('boot-error-msg').textContent =
      (e.message || 'Unknown error') + (e.filename ? ' — ' + e.filename.split('/').pop() : '');
    box.classList.remove('hidden');
  });
</script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/social.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline support is optional */ });
    });
  }
</script>
</body>
</html>
